<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="LOGO.png">
</head>
<body class="home" data-role="user">
<main>
  <header class="top">
    <div>
      <h1>Home</h1>
      <p class="sub" id="welcome">What would you like to do?</p>
    </div>
    <a class="out" id="logout" href="login.html">Log Out</a>
  </header>

  <nav class="menu" aria-label="Main menu">
    <a class="tile" href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <b>My profile</b>
      <small>View and update your details</small>
    </a>

    <a class="tile" href="incident-report.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>
      <b>Incident report</b>
      <small>Report something that happened</small>
    </a>

    <a class="tile" href="complaint-report.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H8l-4 4V4z"/><path d="M8 9h8M8 12h5"/></svg>
      <b>Complaint report</b>
      <small>Submit a complaint</small>
    </a>

    <a class="tile" href="notifications.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 1 1 12 0v6l2 2H4l2-2z"/><path d="M10 21h4"/></svg>
      <b>Notifications <span class="badge" id="count" hidden>0</span></b>
      <small>See updates on your reports</small>
    </a>

    <a class="tile" href="track-status.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
      <b>Track status</b>
      <small>Follow the progress of a report</small>
    </a>
  </nav>
</main>

<script src="auth.js"></script>
<script>
  if (typeof Auth === "undefined") {
    document.querySelector("main").innerHTML =
      "<p>auth.js is missing. Put auth.js in the same folder as this page.</p>";
    throw new Error("auth.js missing");
  }

  // Only signed-in users can see this page. Everyone else goes to sign in.
  var me = Auth.require("user", "user.html");
  if (!me) { throw new Error("not signed in"); }

  // Greet the user by first name
  var first = me.first || String(me.name || "").split(/\s+/)[0];
  if (first) {
    document.getElementById("welcome").textContent =
      "Welcome, " + first + ". What would you like to do?";
  }

  // Log Out ends the session, then goes to the role page
  document.getElementById("logout").addEventListener("click", function () {
    Auth.logout();
  });
</script>
</body>
</html>
